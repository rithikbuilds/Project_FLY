name: Update Flywire Rates

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-flywire-rates
  cancel-in-progress: false

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Fetch Flywire rates
        run: |
          python scripts/fetch_flywire_rates.py

      - name: Show latest Flywire rates
        run: |
          echo "================================"
          echo "LATEST FLYWIRE DATA"
          echo "================================"
          cat data/flywire_latest.json

      - name: Commit updated Flywire rates
        run: |
          git config user.name "Flywire Rate Bot"
          git config user.email "actions@github.com"

          git add data/flywire_latest.json data/flywire_history.csv data/flywire_debug/

          if git diff --cached --quiet; then
            echo "No Flywire data changes detected."
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Update Flywire FX rates"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
