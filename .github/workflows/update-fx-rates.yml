name: Schedule Test

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"


permissions:
  contents: read


jobs:

  schedule-test:

    runs-on: ubuntu-latest

    steps:

      - name: Show trigger information
        run: |
          echo "================================"
          echo "GITHUB SCHEDULE TEST"
          echo "================================"
          echo ""
          echo "Schedule test triggered successfully."
          echo ""
          echo "Event name: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "UTC time:"
          date -u
          echo ""
          echo "================================"
          echo "TEST COMPLETE"
          echo "================================"
