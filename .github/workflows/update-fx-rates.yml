name: Update FX Rates

on:
  workflow_dispatch:

  schedule:
    - cron: "47 3-15 * * *"


permissions:
  contents: write


concurrency:
  group: update-fx-rates
  cancel-in-progress: false


jobs:

  update-rates:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Fetch outward FX rates
        run: |
          python scripts/fetch_rates.py


      - name: Show latest rates
        run: |
          echo "================================"
          echo "LATEST FX DATA"
          echo "================================"

          cat data/latest.json


      - name: Commit updated rates
        run: |
          git config user.name "FX Rate Bot"
          git config user.email "actions@github.com"

          git add data/latest.json data/history.csv

          if git diff --cached --quiet; then
            echo "No FX data changes detected."
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Update outward FX rates"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
