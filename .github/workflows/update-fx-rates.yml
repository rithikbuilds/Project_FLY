name: Update FX Rates

on:

  workflow_dispatch:

  schedule:

    # ======================================================
    # EVERY 10 MINUTES
    # 9:00 AM THROUGH 8:50 PM IST
    # MONDAY THROUGH SUNDAY
    # ======================================================

    - cron: "*/10 9-20 * * *"
      timezone: "Asia/Kolkata"

    # ======================================================
    # FINAL RUN AT 9:00 PM IST
    # ======================================================

    - cron: "0 21 * * *"
      timezone: "Asia/Kolkata"


# ==========================================================
# PERMISSIONS
# ==========================================================

permissions:
  contents: write


# ==========================================================
# PREVENT OVERLAPPING RUNS
# ==========================================================

concurrency:

  group: update-fx-rates

  cancel-in-progress: false


# ==========================================================
# JOBS
# ==========================================================

jobs:

  update-rates:

    runs-on: ubuntu-latest


    steps:

      # ====================================================
      # CHECKOUT REPOSITORY
      # ====================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # ====================================================
      # SET UP PYTHON
      # ====================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"


      # ====================================================
      # INSTALL DEPENDENCIES
      # ====================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ====================================================
      # RUN FX AGENT CONTROLLER
      # ====================================================

      - name: Fetch outward FX rates
        run: |

          python scripts/fetch_rates.py


      # ====================================================
      # SHOW LATEST RESULTS
      # ====================================================

      - name: Show latest rates
        run: |

          echo "================================"

          echo "LATEST FX DATA"

          echo "================================"

          cat data/latest.json


      # ====================================================
      # COMMIT ONLY IF FILES ACTUALLY CHANGED
      # ====================================================

      - name: Commit updated rates
        run: |

          git config user.name "FX Rate Bot"

          git config user.email "actions@github.com"


          git add data/latest.json data/history.csv


          if git diff --cached --quiet; then

            echo "No FX data changes detected."

            echo "Nothing to commit."

            exit 0

          fi


          git commit -m "Update outward FX rates"


          # =================================================
          # SYNC WITH LATEST REPOSITORY STATE
          # =================================================

          git pull --rebase origin "${GITHUB_REF_NAME}"


          # =================================================
          # PUSH UPDATED RATE DATA
          # =================================================

          git push origin "HEAD:${GITHUB_REF_NAME}"
