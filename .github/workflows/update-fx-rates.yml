name: Update FX Rates

on:

  workflow_dispatch:

  schedule:
    - cron: "30 3 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

jobs:

  update-rates:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch outward FX rates
        run: |
          python scripts/fetch_rates.py

      - name: Show latest rates
        run: |
          cat data/latest.json

      - name: Commit updated rates
        run: |

          git config user.name "FX Rate Bot"

          git config user.email "actions@github.com"

          git add data/latest.json data/history.csv

          git diff --cached --quiet || \
          git commit -m "Update outward FX rates"

          git push
